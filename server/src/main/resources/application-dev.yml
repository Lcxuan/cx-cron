server:
  port: 8080

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:postgresql://127.0.0.1:10000/cx_cron
    username: postgres
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

task:
  script:
    storage-path: uploads/scripts # 上传的文件目录，默认 uploads/scripts，支持绝对路径

cxcron:
  auth:
    rsa:
      private-key: ${AUTH_RSA_PRIVATE_KEY} # RSA 私钥
    token:
      access-timeout: 86400
      refresh-timeout: 2592000
  email:
    encryption-key: ${CX_CRON_EMAIL_ENCRYPTIONKEY} # 邮件加密密钥